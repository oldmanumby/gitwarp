name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate (Lint, Fallow, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
        
      - name: Run ESLint
        run: bunx eslint .
        
      - name: Run Fallow (Static Analysis)
        run: bunx fallow
        
      - name: Run Unit/Integration Tests
        run: bun test --cwd apps/gitwarp
